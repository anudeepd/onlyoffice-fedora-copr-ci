# Publish ONLYOFFICE Desktop Editors prebuilt RPMs to Fedora COPR
name: onlyoffice Fedora COPR CI
on:
  schedule:
    - cron: "0 00 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a COPR rebuild even if the version is unchanged"
        type: boolean
        default: false
permissions:
  contents: write
env:
  COPR_PROJECT: onlyoffice
  COPR_USERNAME: anudeepd
  COPR_URL: https://copr.fedorainfracloud.org
  REPO_DEV: ONLYOFFICE
  REPO_NAME: DesktopEditors
  PACKAGE_NAME: onlyoffice-desktopeditors
jobs:
  GetLatestVersion:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.step_version.outputs.VERSION }}
      VERSION_NO_V: ${{ steps.step_version.outputs.VERSION_NO_V }}
      # These three must be declared here as well as written to $GITHUB_OUTPUT:
      # a step output is only visible inside its own job. Declaring the step
      # outputs alone leaves the digests empty in the build job, where they are
      # consumed — and an empty expected digest fails the comparison below.
      DIGEST_X86: ${{ steps.step_version.outputs.DIGEST_X86 }}
      DIGEST_ARM: ${{ steps.step_version.outputs.DIGEST_ARM }}
      DIGEST_HELP: ${{ steps.step_version.outputs.DIGEST_HELP }}
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Get latest version and asset digests
        id: step_version
        run: |
          # Upstream publishes the release RPMs as GitHub assets, and GitHub
          # now reports a sha256 digest for each asset. Capture both digests
          # here so the build job can verify what it downloads without a
          # second API call. A missing digest is a hard failure: the whole
          # point is that the submitted SRPM carries verified bytes.
          release=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases/latest)
          latest_release_tag=$(printf '%s\n' "$release" | jq -r '.tag_name // empty')
          if [ -z "$latest_release_tag" ]; then echo "ERROR: tag empty"; exit 1; fi
          digest_x86=$(printf '%s\n' "$release" | jq -r '.assets[] | select(.name == "onlyoffice-desktopeditors.x86_64.rpm") | .digest // empty')
          digest_arm=$(printf '%s\n' "$release" | jq -r '.assets[] | select(.name == "onlyoffice-desktopeditors.aarch64.rpm") | .digest // empty')
          digest_help=$(printf '%s\n' "$release" | jq -r '.assets[] | select(.name == "onlyoffice-desktopeditors-help.noarch.rpm") | .digest // empty')
          for pair in "x86_64:$digest_x86" "aarch64:$digest_arm" "help:$digest_help"; do
            if [ -z "${pair#*:}" ]; then
              echo "ERROR: no sha256 digest for ${pair%%:*} asset in $latest_release_tag"
              echo "Refusing to build an unverifiable payload."
              exit 1
            fi
          done
          echo "VERSION=$latest_release_tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_NO_V=$(echo "$latest_release_tag" | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "DIGEST_X86=$digest_x86" >> "$GITHUB_OUTPUT"
          echo "DIGEST_ARM=$digest_arm" >> "$GITHUB_OUTPUT"
          echo "DIGEST_HELP=$digest_help" >> "$GITHUB_OUTPUT"

  UpdateFedoraCOPR:
    needs: GetLatestVersion
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # fedora:44 ships no git. Without it actions/checkout silently falls back
      # to downloading a source tarball, leaving no .git behind.
      - name: Install git
        run: sudo dnf install -y -q git
      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
      # Steps run as root inside the container while the bind-mounted workspace
      # is owned by the runner user (uid 1001), so git rejects the repository as
      # dubiously owned. actions/checkout only records safe.directory in a
      # temporary global config that it reverts, so set it explicitly.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo dnf install -y -q copr-cli python3 git gawk jq curl rpm-build cpio rpmdevtools desktop-file-utils appstream chrpath binutils file
      - name: Patch spec and metainfo version
        run: |
          version_no_v="${{ needs.GetLatestVersion.outputs.VERSION_NO_V }}"
          sed -i "s/^Version:.*/Version:        ${version_no_v}/" specs/onlyoffice-desktopeditors.spec
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${version_no_v}\" date=\"$(date +%F)\"|" sources/org.onlyoffice.desktopeditors.metainfo.xml
          head -12 specs/onlyoffice-desktopeditors.spec
      - name: Validate curated AppStream metadata
        run: |
          appstreamcli validate --no-net sources/org.onlyoffice.desktopeditors.metainfo.xml
      - name: Configure copr-cli
        run: |
          mkdir -p $HOME/.config
          cat <<EOF > $HOME/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_BUILD_L }}
          username = ${{ env.COPR_USERNAME }}
          token = ${{ secrets.COPR_BUILD_T }}
          copr_url = ${{ env.COPR_URL }}
          EOF
      - name: Decide whether to build
        id: step_decide
        run: |
          # COPR API is flaky over TLS (curl rc=56 "unexpected eof" seen on
          # GitHub runners); retry with linear backoff instead of failing the
          # scheduled run on a transient drop. HTTP/1.1 avoids h2 conn-reset
          # flakes; timeouts bound each attempt.
          set +e
          rc=1
          for attempt in 1 2 3 4 5; do
            response=$(curl -fsS --http1.1 --connect-timeout 15 --max-time 60 -w '\n%{http_code}' \
              "https://copr.fedorainfracloud.org/api_3/build/list?ownername=${{ env.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.PACKAGE_NAME }}")
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            echo "COPR API query attempt $attempt/5 failed (curl rc=$rc), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: COPR API query failed after 5 attempts (last curl rc=$rc)"
            exit 1
          fi
          http_code=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http_code" != "200" ]; then
            echo "ERROR: COPR API returned HTTP $http_code"
            exit 1
          fi
          LATEST_COPR=$(printf '%s\n' "$body" | jq -r '[.items | sort_by(.id) | reverse[] | select(.state == "succeeded") | .source_package.version] | first // empty')
          # Builds still queued or running hold their NVR in COPR: submitting
          # that NVR again is what desyncs repodata from the stored artifact
          # (see the Release handling below), so they gate a submission just
          # like a succeeded build does. Terminal states follow
          # copr.v3.helpers.wait: succeeded, skipped, failed, canceled.
          # Ignore builds older than COPR's own backend timeout (18000s) —
          # those are never going to publish, so they must not block forever.
          cutoff=$(( $(date +%s) - 21600 ))
          INFLIGHT_COPR=$(printf '%s\n' "$body" | jq -r --argjson cutoff "$cutoff" '
            .items[]
            | select(.state != "succeeded" and .state != "skipped" and .state != "failed" and .state != "canceled")
            | select(.submitted_on > $cutoff)
            | .source_package.version')
          NEW_TAG="${{ needs.GetLatestVersion.outputs.VERSION }}"
          git_version=$(echo "$NEW_TAG" | sed 's/^v//')
          SKIP_INFLIGHT=false
          for inflight in $INFLIGHT_COPR; do
            set +e
            rpmdev-vercmp "$inflight" "$git_version"
            rc=$?
            set -e
            # rpmdev-vercmp: 0 = equal, 11 = first newer, 12 = second newer.
            # Anything but 12 means a build already covers this version.
            if [ "$rc" -ne 12 ]; then
              echo "COPR build $inflight is still in flight — $git_version is already queued, skipping"
              SKIP_INFLIGHT=true
              break
            fi
          done
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force rebuild requested (input force_build=true)"
            echo "START_BUILD=true" >> "$GITHUB_ENV"
          elif [ "$SKIP_INFLIGHT" = "true" ]; then
            echo "START_BUILD=false" >> "$GITHUB_ENV"
          elif [ -z "$LATEST_COPR" ]; then
            echo "No succeeded COPR build yet — triggering first build"
            echo "START_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "Latest COPR = $LATEST_COPR ; new tag = $NEW_TAG"
            set +e
            rpmdev-vercmp "$LATEST_COPR" "$git_version"
            rc=$?
            set -e
            # rpmdev-vercmp: 0 = equal, 11 = first newer, 12 = second newer
            if [ "$rc" -eq 12 ]; then
              echo "START_BUILD=true" >> "$GITHUB_ENV"
            else
              echo "START_BUILD=false" >> "$GITHUB_ENV"
            fi
          fi
      - name: Build SRPM and submit to COPR
        if: env.START_BUILD == 'true'
        env:
          VERSION: ${{ needs.GetLatestVersion.outputs.VERSION }}
          VERSION_NO_V: ${{ needs.GetLatestVersion.outputs.VERSION_NO_V }}
          DIGEST_X86: ${{ needs.GetLatestVersion.outputs.DIGEST_X86 }}
          DIGEST_ARM: ${{ needs.GetLatestVersion.outputs.DIGEST_ARM }}
          DIGEST_HELP: ${{ needs.GetLatestVersion.outputs.DIGEST_HELP }}
        run: |
          rpmdev-setuptree
          # Force builds get a unique Release so we never collide with an
          # existing NVR in COPR (duplicate NVRs desync repodata from the
          # stored artifact and break dnf installs). The run ID makes every
          # forced submission distinct, e.g.
          # onlyoffice-desktopeditors-<version>-1.f<run_id>.
          if [ "${{ inputs.force_build }}" = "true" ]; then
            sed -i "s/^Release:.*/Release: %{autorelease}.f${{ github.run_id }}/" specs/onlyoffice-desktopeditors.spec
          fi
          # spectool fetches all three upstream RPMs (Source0/Source1 — the
          # SRPM must carry the payload for every chroot COPR builds, plus the
          # noarch help RPM as Source2). No fallback: a failed fetch fails the
          # build. Note this pulls ~1.08 GB per run.
          cp sources/org.onlyoffice.desktopeditors.metainfo.xml $HOME/rpmbuild/SOURCES/
          cp specs/onlyoffice-desktopeditors.spec $HOME/rpmbuild/SPECS/
          cd $HOME/rpmbuild/SPECS
          spectool -g -R onlyoffice-desktopeditors.spec
          # Integrity check: each upstream RPM must match the sha256 GitHub
          # reports for that release asset. NOTE: same-origin integrity only —
          # it guards against truncated or substituted downloads, not a signing
          # boundary: upstream publishes no detached signatures, and the vendor
          # yum repo rebuilds from its own sources, so its copy of any given
          # version is a different build with a different hash (see README.md)
          # and cannot be used as a reference here.
          verify_rpm() {
            rpm_path="$1"
            expected="$2"
            [ -f "$rpm_path" ] || { echo "ERROR: expected upstream RPM $rpm_path was not downloaded"; exit 1; }
            actual="sha256:$(sha256sum "$rpm_path" | awk '{print $1}')"
            if [ "$expected" != "$actual" ]; then
              echo "ERROR: checksum mismatch for $(basename "$rpm_path") ($VERSION)"
              echo "upstream API: $expected"
              echo "actual:       $actual"
              exit 1
            fi
            echo "Checksum OK for $(basename "$rpm_path")"
          }
          verify_rpm "$HOME/rpmbuild/SOURCES/onlyoffice-desktopeditors.x86_64.rpm" "$DIGEST_X86"
          verify_rpm "$HOME/rpmbuild/SOURCES/onlyoffice-desktopeditors.aarch64.rpm" "$DIGEST_ARM"
          verify_rpm "$HOME/rpmbuild/SOURCES/onlyoffice-desktopeditors-help.noarch.rpm" "$DIGEST_HELP"
          rpmbuild -bs onlyoffice-desktopeditors.spec
          SRPM=$(ls $HOME/rpmbuild/SRPMS/onlyoffice-desktopeditors-*.src.rpm | head -1)
          echo "Submitting $SRPM to COPR ($(du -h "$SRPM" | cut -f1))"
          copr-cli build --nowait ${{ env.COPR_PROJECT }} "$SRPM"
